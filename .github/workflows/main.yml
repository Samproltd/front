name: CI - Build and Deploy Angular to Azure Web App

on:
  push:
    branches:
      - main
      - workflow-setup
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build the application
        run: NODE_OPTIONS=--openssl-legacy-provider npm run build -- --configuration=production

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          UBUNTU_VERSION=$(lsb_release -rs)
          if [[ "$UBUNTU_VERSION" == "24.04" ]]; then
            sudo apt-get install -y libnss3 libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 libxi6 libxrandr2 libgbm1
          else
            sudo apt-get install -y libnss3 libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 libxi6 libxrandr2 libgbm1 libasound2
          fi

      - name: Docker login
        run: echo "${{ secrets.ANGULAR_AZURE }}" | docker login -u "${{ secrets.ANGULAR_AZURE }}" --password-stdin

      - name: Docker build & push
        run: |
          docker build -t myusername/angular-app -f Dockerfile .
          docker tag myusername/angular-app myusername/angular-app:latest
          docker push myusername/angular-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'angular'  # Change to your Azure Web App name
          images: 'myusername/angular-app:latest'
