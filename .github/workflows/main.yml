name: CI

on:
  push:
    branches:
      - main
      - workflow-setup
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16"
          cache: "npm"
          
          
      - name: Verify Node.js version
        run: node --version

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build the application
        env:
          NODE_OPTIONS: "--openssl-legacy-provider"
        run: npm run build --configuration=production

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          UBUNTU_VERSION=$(lsb_release -rs)
          if [[ "$UBUNTU_VERSION" == "24.04" ]]; then
            sudo apt-get install -y libnss3 libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 libxi6 libxrandr2 libgbm1
          else
            sudo apt-get install -y libnss3 libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 libxi6 libxrandr2 libgbm1 libasound2
          fi

      - name: Docker build
        run: docker build -t myusername/myapp -f Dockerfile .
        
    
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name:build-output
          path: ./dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      # Download the build artifacts from the previous job
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist

      - name: Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: 'Login to Azure'
        run: |
          az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}

      - name: 'Deploy to Azure App Service'
        run: |
          az webapp deploy --resource-group Samproexam2025 --name angular --src-path ./dist --type static