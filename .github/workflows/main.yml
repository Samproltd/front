name: Build and Deploy Angular Project

on:
  push:
    branches:
      - main  # Trigger the action on pushing to the main branch
  pull_request:
    branches:
      - main  # Trigger on PRs targeting the main branch

jobs:
  build:
    runs-on: ubuntu-latest  # The environment where the job will run

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # Checkout your repository code

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'  # Set the Node.js version you want to use

    - name: Install dependencies
      run: |
        npm install  # Install dependencies using npm

    - name: Build Angular Project
      run: |
        npm run build --prod  # Build the Angular project for production

    - name: Build Docker Image
      run: |
        docker build -t your-dockerhub-username/examfront .  # Build the Docker image

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}  # Docker username stored in GitHub Secrets
        password: ${{ secrets.DOCKER_PASSWORD }}  # Docker password stored in GitHub Secrets

    - name: Push Docker Image to Docker Hub
      run: |
        docker push your-dockerhub-username/examfront  # Push the Docker image to Docker Hub

    - name: Deploy to Azure (Optional)
      run: |
        # Add your Azure deployment 
